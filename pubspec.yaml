name: chord_trainer
description: Real-time classical guitar chord practice with FFT-based feedback.
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^6.0.0
  fftea: ^1.5.0+1
  permission_handler: ^11.4.0
  audioplayers: ^6.5.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/chords.json
    - assets/songs.json
    - assets/strum_patterns.json
    - assets/metronome_click.wav
